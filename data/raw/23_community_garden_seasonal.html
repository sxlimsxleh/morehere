<h1>Mitmachtag im Gemeinschaftsgarten Laim</h1>
<p>Von April bis Oktober jeden Samstag von 10 bis 13 Uhr.</p>
<p>Ort: Gemeinschaftsgarten Laim, Fürstenrieder Straße 155</p>
<p>Keine Vorkenntnisse nötig, Handschuhe und Werkzeug sind da.</p>
<p>Kostenlos. Danach gibt es oft Kaffee und Kuchen.</p>
