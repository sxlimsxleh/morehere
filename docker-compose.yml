services:
  db:
    build: docker/postgres
    environment:
      POSTGRES_USER: morehere
      POSTGRES_PASSWORD: morehere  # local development only
      POSTGRES_DB: morehere
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Check over TCP: during first-time init, a temporary server listens on the
      # socket only, so a socket check would report healthy before init scripts finish.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U morehere -d morehere"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
