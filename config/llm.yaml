# LLM settings for extraction. The model itself comes from ANTHROPIC_MODEL (.env).

default_model: claude-opus-5-5
# Thinking depth/token spend. claude-opus-5-5 defaults to "medium" if unset; we set it
# explicitly so runs are comparable. Override with ANTHROPIC_EFFORT.
default_effort: medium
max_tokens: 16000

# USD per million tokens, for the est_cost_usd in logs and eval reports (rule 9).
# Estimates: if a refusal fallback served the request, it ran at that model's rates.
prices_per_mtok:
  claude-opus-5-5: {input: 4.00, output: 20.00, cache_read: 0.20, cache_write: 5.00}
  claude-sonnet-5-5: {input: 2.00, output: 10.00, cache_read: 0.10, cache_write: 2.50}
  claude-haiku-5-5: {input: 0.10, output: 0.50, cache_read: 0.01, cache_write: 0.125}
